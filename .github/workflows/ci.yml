name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Invariante 1 de docs/doctrine/restricao-de-canal.md: nenhuma feature
      # nomeia um provider. Step próprio (e não só dentro de `gov:verify`)
      # porque é o CI que gateia PR — `gov:verify` não é invocado por nenhum
      # workflow, e mecanismo que não roda no gate não protege nada.
      - name: Channel provider leak
        run: pnpm lint:channels

      - name: Unit tests
        run: pnpm test:unit

      # Scripts do kit self-host num repo git descartável (docker/crontab
      # dublados). É o único gate que exercita o update.sh — um erro aqui
      # rebobina a instalação de quem hospeda, e nenhum teste TS o veria.
      #
      # Desde 2026-08-08 inclui `hostgator-setup-kit/test-validators.sh`, os 163
      # casos que cobrem o install.sh. Eles existiam e NÃO rodavam em job nenhum
      # (issue #191): dois defeitos que tornavam a instalação impossível —
      # escolher OpenRouter travava o instalador num laço, escolher OpenAI
      # deixava o .env pela metade — passaram por todos os checks verdes. 15s.
      - name: Kit self-host (bash)
        run: pnpm test:shell

  # Varredura de segredo na árvore do PR (docs/threat-model.md §T7).
  #
  # Job separado e curto (~30s): não depende de node_modules, então dá o
  # feedback antes do verify terminar — e chave vazada é o achado em que
  # segundos importam, porque a correção não é reverter o commit, é ROTACIONAR.
  #
  # Escopo: `gitleaks dir` varre a ÁRVORE, não o histórico. É deliberado. Um
  # segredo introduzido por um PR está na árvore desse PR, então o gate o pega;
  # varrer o histórico inteiro a cada PR só re-julgaria o passado para sempre —
  # o repo tem um achado histórico conhecido (`.env.waha`, commit d2595e3d,
  # já removido do tracking por d45425fa; o que ficou é um hash SHA512, não a
  # chave) e ele reprovaria todo PR sem que ninguém pudesse fazer nada a
  # respeito. Histórico se varre sob demanda: `gitleaks git . -c .gitleaks.toml`.
  #
  # Versão PINADA: gate que se auto-atualiza muda de veredito sozinho entre dois
  # pushes idênticos, e aí ninguém sabe se o vermelho é o código ou a ferramenta.
  segredos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Instala gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Varredura de segredo
        run: ./gitleaks dir . --no-banner --redact --exit-code 1 -c .gitleaks.toml

  # Gate de isolamento multi-tenant + invariantes de governança.
  # Job separado de propósito: roda em paralelo ao verify (não atrasa o feedback
  # rápido) e vira um check nomeado, que é o que a doutrina de RLS exige provar.
  # scripts/test-db.sh sobe pgvector/pgvector:pg17, aplica supabase/baseline.sql
  # em modo install (ON_ERROR_STOP=1) e update (idempotência), e roda
  # tests/invariants/** contra ele. Invocar via `pnpm test:db` é o que põe
  # node_modules/.bin no PATH que o script herda para chamar `vitest`.
  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: RLS isolation + governance invariants
        run: pnpm test:db
